<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e10600">
<meta name="description" content="MFD 梦想冰船方程式 · 2027 赛季与赛事安排。">
<title>MFD 梦想冰船方程式 · 2027 赛季</title>
<style>
/* ============ 性能自适应（iPad 5 / 一加 Turbo 6V 双档） ============ */
:root{
  --red:#e10600; --red2:#ff3b2e; --cyan:#00c6cf; --cyan2:#5fe3ea;
  --ink:#11141a; --ink2:#1b2030; --line:rgba(255,255,255,.10);
  --ease:cubic-bezier(.30,.78,0,1);
}
.perf-low{ --dur:0ms; }
.perf-low *{ animation:none !important; transition:none !important; }

/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#e10600 #0a0c12}
body{
  font-family:"PingFang SC","HarmonyOS Sans","Microsoft YaHei",-apple-system,sans-serif;
  background:#0a0c12; color:#eef1f6; line-height:1.75;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button,a,summary{-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--cyan2);outline-offset:3px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--red),var(--cyan));border-radius:9px}
::-webkit-scrollbar-track{background:#0a0c12}

/* ============ 滚动进度条 ============ */
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:2000;
  background:linear-gradient(90deg,var(--red),var(--cyan));
  box-shadow:0 0 14px rgba(225,6,0,.75);will-change:width;transform:translateZ(0)}

/* ============ 导航 ============ */
nav{position:fixed;inset:0 0 auto 0;z-index:1000;
  background:#101116;
  border-bottom:1px solid var(--line);
  contain:paint layout;
}
.nav-in{max-width:1320px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 22px 12px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand .mk{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--red),#7a0400);
  box-shadow:0 6px 18px rgba(225,6,0,.42),inset 0 1px 0 rgba(255,255,255,.25)}
.brand .mk b{color:#fff;font-size:13px;letter-spacing:-.5px;font-weight:800}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt span:first-child{font-weight:800;font-size:15px;letter-spacing:.5px}
.brand-txt span:last-child{font-size:10px;color:#93a0b3;letter-spacing:1.4px}
nav ul{display:flex;flex:1 1 auto;min-width:0;gap:4px;list-style:none;margin-left:auto;overflow-x:auto;
  scrollbar-width:none;padding:2px}
nav ul::-webkit-scrollbar{display:none}
nav ul{overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch}
nav a{display:block;padding:8px 12px;border-radius:10px;font-size:13px;color:#c9d2e0;
  white-space:nowrap;position:relative;transition:color .28s var(--ease),background .28s var(--ease)}
nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
nav a.on{color:#fff;background:linear-gradient(135deg,rgba(225,6,0,.40),rgba(0,198,207,.24))}
nav a.on::after{content:"";position:absolute;left:50%;bottom:2px;width:16px;height:2px;border-radius:2px;
  background:var(--red);transform:translateX(-50%)}
.nav-cta{flex:0 0 auto;padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:700;
  background:linear-gradient(135deg,var(--red),var(--red2));
  transition:transform .3s var(--ease)}
.nav-cta:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 12px 26px rgba(225,6,0,.55)}

/* ============ 通用区块 ============ */
section{padding:104px 22px 70px;max-width:1320px;margin:0 auto;position:relative;contain:content;scroll-margin-top:92px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:2.6px;
  color:var(--cyan2);text-transform:uppercase;margin-bottom:14px;font-weight:700}
.kicker::before{content:"";width:26px;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}
h2{font-size:clamp(26px,5vw,42px);line-height:1.18;font-weight:850;letter-spacing:-.5px;margin-bottom:8px}
.h2sub{color:#8d9aad;font-size:14px;margin-bottom:38px;max-width:640px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:38px}
.eyebrow{width:56px;height:56px;border-radius:8px;display:grid;place-items:center;font-size:22px;font-weight:800;
  background:#17191f;border:1px solid var(--line)}
.blk{background:#14161c;border:1px solid #292c34;border-radius:12px;contain:paint}
.blk:hover{border-color:rgba(255,255,255,.20)}

/* ============ 首屏 ============ */
.hero{max-width:none;padding:120px 22px 52px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(115deg,#16181e 0%,#0d0e12 52%,#1d0b0b 100%);border-bottom:1px solid #30313a}
.season-hero{max-width:1160px;margin:0 auto}
.season-kicker{color:#aeb2bc;font-size:12px;letter-spacing:3px;font-weight:800}
.hero h1{margin:8px 0 0;font-size:clamp(54px,10vw,112px);font-weight:950;line-height:.98;letter-spacing:-4px}
.hero h1 span{color:var(--red)}
.champion{display:inline-flex;align-items:center;gap:14px;margin:22px auto 24px;padding:8px 18px;
  border-left:3px solid var(--red);background:#202127;text-align:left}
.champion span{color:#aeb2bc;font-size:12px;font-weight:700;letter-spacing:1px}
.champion strong{font-size:20px}
.emblem{width:min(56vw,480px);max-height:300px;object-fit:contain;margin:0 auto}
.season-timeline{max-width:1320px;margin:76px auto 0;padding:0 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative}
.season-timeline::before{content:"";position:absolute;left:0;right:0;top:56px;height:5px;background:#35363a}
.season-timeline::after{content:"";position:absolute;left:0;top:56px;width:50%;height:5px;background:var(--red);z-index:1}
.season-timeline + .hero{padding-top:48px}
.season-item{position:relative;min-width:0;min-height:96px;padding:8px 18px 34px;text-align:center;color:#8f9198;background:#101116;border-right:1px solid #292a2e}
.season-item:first-child{border-left:1px solid #292a2e}
.season-item small{display:block;font-size:12px;font-weight:700;line-height:1.35}
.season-item strong{display:block;font-size:17px;line-height:1.4}
.season-item::after{content:"";position:absolute;z-index:2;left:50%;top:47px;width:20px;height:20px;transform:translateX(-50%);
  border:4px solid #38393d;border-radius:50%;background:#0a0c12}
.season-item.is-current{color:#fff;background:linear-gradient(180deg,rgba(225,6,0,.20),transparent 82%)}
.season-item.is-current small{color:var(--red2)}
.season-item.is-current::after{border-color:var(--red);background:#0a0c12;box-shadow:0 0 0 3px rgba(225,6,0,.2)}
.season-item.is-past::after{content:"✓";top:43px;width:28px;height:28px;border:0;background:#f2f2f2;color:#111;
  font-size:17px;font-weight:900;line-height:28px}
.season-item.is-future::after{background:#101116}
.hero .tag{display:none}
.hero-copy{display:block}
.hero-meta,.scroll-hint{display:none}
.btn{padding:15px 30px;border-radius:6px;font-weight:750;font-size:15px;position:relative;overflow:hidden;
  transition:transform .24s var(--ease)}
.btn-red{background:var(--red)}
.btn-ghost{background:#202127;border:1px solid #41434b}
.btn:hover{transform:translateY(-2px)}

/* ============ 数据卡 ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:24px 20px;border-radius:18px;position:relative;overflow:hidden;cursor:default}
.stat .n{font-size:clamp(28px,5.6vw,46px);font-weight:880;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(150deg,#fff,var(--cyan2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:13px;color:#a3aec0;margin-top:8px;letter-spacing:.5px}
.stat .g{position:absolute;right:-22px;bottom:-22px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(225,6,0,.45),transparent 70%)}
.stat:nth-child(2) .g{background:radial-gradient(circle,rgba(0,198,207,.42),transparent 70%)}
.stat:nth-child(3) .g{background:radial-gradient(circle,rgba(255,196,0,.34),transparent 70%)}

/* ============ 联赛三级卡 ============ */
.tiers{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px}
.tier{padding:26px;border-radius:20px;position:relative;overflow:hidden;contain:paint}
.tier-pl{background:linear-gradient(150deg,rgba(255,196,0,.14),rgba(255,196,0,.02) 70%);
  border-color:rgba(255,196,0,.32);box-shadow:0 20px 50px rgba(255,196,0,.12)}
.tier-1{border-color:rgba(225,6,0,.42)}
.tier-2{border-color:rgba(0,198,207,.34)}
.tier .lvl{font-size:11.5px;letter-spacing:2.4px;font-weight:800}
.tier-pl .lvl{color:#ffce54}
.tier-1 .lvl{color:var(--red2)}
.tier-2 .lvl{color:var(--cyan2)}
.tier h3{font-size:clamp(19px,3.4vw,25px);margin:10px 0 6px;font-weight:820}
.tier p{font-size:13px;color:#98a5b7;line-height:1.7}
.tier .seat{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:20px;font-size:11.5px;
  background:rgba(255,255,255,.08);border:1px solid var(--line);color:#d3dae6}

/* ============ 横向赛事日历 ============ */
.match-section{max-width:1320px;padding-top:58px;padding-bottom:58px}
.match-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.match-head h2{font-size:clamp(28px,4vw,42px);margin:0}
.match-head .kicker{margin-bottom:8px}
.match-carousel{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;gap:12px;align-items:stretch}
.match-arrow{width:100%;min-height:220px;display:grid;place-items:center;border:1px solid #41434b;
  border-radius:5px;background:#17191f;color:#fff;font-size:24px;cursor:pointer}
.match-arrow:hover:not(:disabled){background:var(--red);border-color:var(--red)}
.match-arrow:disabled,.match-arrow.is-disabled{opacity:.42;cursor:not-allowed}
.match-viewport{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;overscroll-behavior-x:contain}
.match-viewport::-webkit-scrollbar{display:none}
.match-track{display:flex;align-items:stretch;gap:14px}
.match-card{position:relative;flex:0 0 clamp(260px,30vw,340px);min-height:220px;padding:22px;
  scroll-snap-align:start;background:#15171d;border:1px solid #30333b;border-top:3px solid #454851}
.match-card:hover{border-top-color:var(--red);background:#1b1d24}
.match-card-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}
.match-date{font-size:13px;color:#fff;font-weight:850;letter-spacing:.5px}
.match-phase{font-size:10px;color:#aab0bc;border:1px solid #393c44;padding:3px 7px}
.match-card h3{font-size:20px;line-height:1.35;margin-bottom:8px}
.match-card p{color:#9399a6;font-size:12px;line-height:1.6}
.match-status{position:absolute;right:18px;bottom:18px;color:#c4c7ce;font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:1px}
.match-coming{display:grid;place-items:center;text-align:center;border-style:dashed;background:#101115}
.match-coming h3{font-size:24px;letter-spacing:2px}
.replay-note{margin-top:13px;color:#898e99;font-size:12px}
.dashboard{max-width:1240px;padding-top:24px;padding-bottom:74px}
.home-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}
.join-panel,.rank-panel{min-width:0;min-height:360px;padding:clamp(22px,3vw,38px);background:#15171d;border:1px solid #30333b}
.join-panel{display:flex;flex-direction:column;justify-content:space-between;border-top:4px solid var(--red)}
.join-panel .kicker{margin-bottom:12px}
.join-panel h2{font-size:clamp(36px,5vw,58px);letter-spacing:-1.8px;margin-bottom:14px}
.join-panel p{max-width:440px;color:#aeb2bc;font-size:15px}
.join-panel .btn{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;margin-top:26px}
.rank-panel{border-top:4px solid #eceef2}
.rank-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.rank-panel-head h2{font-size:25px;margin:0}
.rank-columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.rank-list h3{font-size:12px;letter-spacing:1.7px;color:#aeb2bc;margin-bottom:10px}
.rank-list ol{list-style:none;counter-reset:rank}
.rank-list li{counter-increment:rank;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:7px;
  padding:9px 0;border-bottom:1px solid #30333b;font-size:12.5px}
.rank-list li::before{content:counter(rank,decimal-leading-zero);color:#8c929d;font-size:10px;font-weight:800}
.rank-list li:first-child::before{color:#ffce54}
.rank-list .rank-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}
.rank-list .rank-score{color:#f2f3f5;font-weight:850;font-variant-numeric:tabular-nums}
.rank-more{display:inline-block;margin-top:16px;color:#f1f2f4;font-size:12px;font-weight:800}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:750;letter-spacing:.6px;margin-left:8px}
.pill-done{background:rgba(0,198,207,.14);color:var(--cyan2)}
.pill-active{background:rgba(225,6,0,.18);color:var(--red2)}
.pill-next{background:rgba(255,255,255,.07);color:#aab5c6}

/* ============ 积分榜 ============ */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:11px 22px;border-radius:24px;font-size:13.5px;font-weight:720;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:#b9c3d2;
  transition:all .3s var(--ease);font-family:inherit}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--red),var(--cyan));box-shadow:0 10px 24px rgba(225,6,0,.32)}
.st-blk{padding:10px;border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:13.5px;contain:paint}
th{text-align:left;padding:13px 12px;font-size:11px;letter-spacing:1.5px;color:#7c899c;
  border-bottom:1px solid var(--line);font-weight:700}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr{transition:background .28s var(--ease),transform .28s var(--ease)}
tbody tr:hover{background:rgba(255,255,255,.065);transform:translateX(3px)}
.rk{font-variant-numeric:tabular-nums;width:44px;font-weight:800;color:#6f7d91}
.rk-gold{color:#ffce54;text-shadow:0 0 10px rgba(255,206,84,.55)}
.rk-silver{color:#dfe6ef}
.rk-bronze{color:#d98a5b}
.driver{display:flex;align-items:center;gap:11px;font-weight:700}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;
  background:linear-gradient(135deg,var(--red),var(--cyan));color:#04131a;flex:0 0 auto}
.team-tag{padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:750;letter-spacing:.7px;
  background:rgba(255,255,255,.07);color:#b9c3d2}
.pts{font-weight:880;font-variant-numeric:tabular-nums;color:var(--cyan2);text-align:right;font-size:15px}
.fl{color:var(--red2);font-weight:750}
.note{margin-top:14px;font-size:11.5px;color:#7c899c;line-height:1.8}
.note code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:5px;font-size:10.5px}

/* ============ 规则折叠 ============ */
details{margin-bottom:10px;border-radius:14px;overflow:hidden;transition:background .3s var(--ease)}
details[open]{background:rgba(255,255,255,.065)}
summary{padding:17px 20px;cursor:pointer;font-weight:720;font-size:15px;list-style:none;
  display:flex;align-items:center;gap:12px;contain:paint}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";font-size:20px;color:var(--cyan2);transition:transform .36s var(--ease);
  width:16px;height:16px;display:grid;place-items:center;line-height:1}
details[open] summary::before{transform:rotate(90deg)}
summary .idx{font-size:10.5px;padding:3px 7px;border-radius:5px;background:rgba(225,6,0,.18);color:var(--red2);font-weight:800}
.rule-body{padding:4px 20px 20px 48px;font-size:13.5px;color:#c3cddb;line-height:1.9}
.rule-body b{color:#fff}
.rule-body .hl{color:var(--red2);font-weight:750}
.rule-body .ok{color:var(--cyan2);font-weight:750}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:6px 12px;border-radius:20px;font-size:11.5px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);color:#c3cddb}

/* ============ 车队 ============ */
.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.team{padding:22px;border-radius:20px}
.team-hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.team-hd .badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:17px;font-weight:880;color:#04131a}
.team-hd h3{font-size:19px;font-weight:820}
.team-hd .sum{margin-left:auto;font-size:11.5px;color:#8d9aad}
.team-hd .sum b{color:var(--cyan2);font-size:16px;font-variant-numeric:tabular-nums}
.tcat{font-size:11px;letter-spacing:1.8px;color:var(--cyan2);font-weight:750;margin:14px 0 8px;
  display:flex;align-items:center;gap:7px}
.tcat::before{content:"";width:16px;height:2px;background:var(--cyan)}
.seat{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;border-radius:11px;
  background:rgba(255,255,255,.04);font-size:13.5px;transition:transform .3s var(--ease),background .3s var(--ease)}
.seat:hover{transform:translateX(4px);background:rgba(255,255,255,.085)}
.seat .g{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 auto}
.seat.sub .g{background:var(--cyan)}
.seat .nm{font-weight:720;flex:1}
.seat .st{font-size:10.5px;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.07);color:#aab5c6}
.vac{color:#7c899c;font-style:italic;font-weight:500}
.lmb .badge{background:linear-gradient(135deg,#e10600,#ff6b5e)}
.lindong .badge{background:linear-gradient(135deg,#00c6cf,#7feaef)}
.lingjie .badge{background:linear-gradient(135deg,#7c4dff,#b79bff)}
.lang .badge{background:linear-gradient(135deg,#ff9d00,#ffd166)}

/* ============ 新闻 ============ */
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.n{display:block;padding:20px;border-radius:18px;transition:transform .4s var(--ease),border-color .4s var(--ease);contain:paint}
.n:hover{transform:translateY(-5px)}
.n .d{font-size:11.5px;color:var(--cyan2);letter-spacing:.8px;font-weight:700}
.n h4{font-size:16px;margin:9px 0 7px;line-height:1.5;font-weight:770}
.n p{font-size:12.5px;color:#93a0b3;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nt{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:750;letter-spacing:.7px}
.nt-race{background:rgba(225,6,0,.16);color:var(--red2)}
.nt-rule{background:rgba(0,198,207,.14);color:var(--cyan2)}
.nt-biz{background:rgba(255,206,84,.14);color:#ffce54}

/* ============ 赛道投稿 ============ */
.tracks{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tk{padding:18px;border-radius:18px;display:flex;gap:14px;align-items:flex-start;contain:paint}
.tk .tn{width:54px;height:54px;border-radius:14px;flex:0 0 auto;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--cyan),#035b66)}
.tk .tn span{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:880;color:#04131a}
.tk-b{flex:1;min-width:0}
.tk-b h4{font-size:16.5px;font-weight:770;margin-bottom:5px}
.tk-b p{font-size:12.5px;color:#93a0b3;line-height:1.65}
.tk-b .go{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:12px;font-weight:720;
  color:var(--cyan2);transition:gap .3s var(--ease)}
.tk:hover .go{gap:10px}
/* ============ 赞助商 ============ */
.sp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sp{height:104px;border-radius:16px;display:grid;place-items:center;text-align:center;padding:14px;
  font-weight:780;font-size:14px;letter-spacing:.4px;position:relative;overflow:hidden;
  transition:transform .4s var(--ease),border-color .4s var(--ease);contain:paint}
.sp:hover{transform:translateY(-4px)}
.sp.t1{border-color:rgba(255,206,84,.40);background:linear-gradient(150deg,rgba(255,206,84,.13),rgba(255,206,84,.02));
  box-shadow:0 16px 40px rgba(255,206,84,.10)}
.sp.t1::after{content:"冠名";position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:1.4px;
  padding:2px 6px;border-radius:4px;background:rgba(255,206,84,.22);color:#ffce54;font-weight:800}
.sp.t2{border-color:rgba(255,255,255,.12)}
.sp .lv{position:absolute;top:9px;left:10px;font-size:9px;letter-spacing:1.6px;color:#7c899c;font-weight:700}

/* ============ 联系 ============ */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.ci{padding:22px;border-radius:18px;display:flex;gap:14px;align-items:flex-start;contain:paint;
  transition:transform .36s var(--ease),border-color .36s var(--ease)}
.ci:hover{transform:translateX(4px)}
.ci .ic{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,var(--red),var(--cyan))}
.ci h4{font-size:15px;font-weight:760}
.ci p{font-size:12.5px;color:#a3aec0;word-break:break-all}
.qr{padding:22px;border-radius:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.qr img{width:200px;height:200px;border-radius:14px;background:#fff;padding:9px;
  box-shadow:0 18px 44px rgba(0,0,0,.4)}
.qr small{color:#93a0b3;font-size:11.5px;letter-spacing:.8px}

/* ============ 报名 ============ */
.reg{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.reg-txt h3{font-size:22px;font-weight:820;margin-bottom:12px}
.reg-txt p{color:#98a5b7;font-size:13.5px;margin-bottom:12px}
.reg-steps{list-style:none;margin-top:16px}
.reg-steps li{padding:10px 0 10px 34px;position:relative;font-size:13.5px;color:#c3cddb;border-bottom:1px dashed rgba(255,255,255,.07)}
.reg-steps li::before{content:attr(data-i);position:absolute;left:0;top:10px;width:22px;height:22px;border-radius:7px;
  background:linear-gradient(135deg,var(--red),var(--cyan));color:#04131a;font-size:11px;font-weight:850;
  display:grid;place-items:center}
.fld{display:block;margin-bottom:13px}
.fld label{display:block;font-size:11.5px;letter-spacing:1.2px;color:var(--cyan2);margin-bottom:7px;font-weight:700}
.fld input,.fld select{width:100%;padding:14px 15px;border-radius:12px;font-size:14px;font-family:inherit;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:#eef1f6;outline:none;
  color-scheme:dark;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.fld input:focus,.fld select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,6,0,.18)}
.submit{width:100%;padding:16px;border:0;border-radius:13px;font-size:15px;font-weight:800;font-family:inherit;
  background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;cursor:pointer;
  box-shadow:0 14px 30px rgba(225,6,0,.38);transition:transform .34s var(--ease)}
.submit:hover{transform:translateY(-2px)}

/* ============ 页脚 ============ */
footer{margin-top:60px;padding:44px 22px 34px;text-align:center;border-top:1px solid var(--line);
  background:#101116}
footer .mk{width:46px;height:46px;border-radius:13px;margin:0 auto 14px;display:grid;place-items:center;font-size:17px;font-weight:880;
  background:linear-gradient(135deg,var(--red),var(--cyan))}
footer .m{color:#7c899c;font-size:11.5px;line-height:1.9;letter-spacing:.6px}

/* ============ 入场动画 ============ */
.rv{opacity:1;transform:none;transition:none;will-change:auto;contain:paint}
.rv.in{opacity:1;transform:none}

/* ============ 响应式 ============ */
@media(max-width:1080px){.tiers{grid-template-columns:1fr 1fr}.news,.tracks{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
  section{padding:84px 16px 50px;scroll-margin-top:112px}
  .stats,.teams,.contact,.reg,.sp-grid,.news,.tracks{grid-template-columns:1fr 1fr}
  .nav-in{padding:10px 14px;gap:10px}
  .brand-txt{display:none}
  nav ul{margin-left:0}
  nav a{padding:7px 9px;font-size:12.5px}
  table{font-size:12.5px}
  th,td{padding:10px 8px}
  .sp-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sp{height:88px;font-size:12px}
  .hero-meta{display:none}
}
@media(max-width:520px){
  .nav-in{flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px}
  nav ul{order:3;flex:1 0 100%;margin:0;padding:0 0 2px}
  nav .nav-cta{margin-left:auto;padding:8px 12px;font-size:12px}
  nav a{padding:7px 10px}
  section{scroll-margin-top:104px}
  .stats,.teams,.contact,.reg,.sp-grid,.news,.tracks{grid-template-columns:1fr}
  .tiers{grid-template-columns:1fr}
  .sp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:32px 18px 34px}
  .hero h1{letter-spacing:-2px}
  .emblem{width:min(70vw,340px);max-height:220px}
  .champion{margin:16px auto 20px}
  .match-section{padding:48px 16px 38px}
  .match-head{align-items:flex-start}
  .match-head h2{font-size:28px}
  .match-carousel{grid-template-columns:38px minmax(0,1fr) 38px;gap:7px}
  .match-arrow{min-height:200px;font-size:19px}
  .match-card{flex-basis:min(82vw,330px);min-height:200px;padding:18px}
  .season-timeline{margin-top:54px;padding:0 12px}
  .season-timeline::before{top:52px}
  .season-item{min-height:88px;padding:6px 5px 30px}
  .season-item small{font-size:10px}
  .season-item strong{font-size:14px}
  .season-item::after{top:44px;width:18px;height:18px}
  .season-item.is-past::after{top:41px;width:24px;height:24px;font-size:14px;line-height:24px}
  .home-panels,.rank-columns{grid-template-columns:1fr}
  .join-panel,.rank-panel{min-height:0;padding:23px}
  .join-panel h2{font-size:42px}
  .rank-columns{gap:20px}
  .ci{flex-direction:column;text-align:center}
  .qr img{width:170px;height:170px}
  .btn{padding:13px 22px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="bar"></div>
<nav>
  <div class="nav-in">
    <div class="brand">
      <div class="mk">MFD</div>
      <div class="brand-txt"><span>梦想冰船方程式</span><span>MC FORMULA DREAM · 2027</span></div>
    </div>
  </div>
</nav>

<section class="season-timeline" aria-label="赛季时间轴">
  <div class="season-item is-past"><small>2026 赛季</small><strong>总冠军：小苗</strong></div>
  <div class="season-item is-current" aria-current="page"><small>现在</small><strong>2027 赛季</strong></div>
  <div class="season-item is-future"><small>即将到来</small><strong>2028 赛季</strong></div>
</section>

<header class="hero" id="top">
  <div class="season-hero">
    <p class="season-kicker">MC FORMULA DREAM · OFFICIAL SEASON</p>
    <h1>2027 <span>赛季</span></h1>
    <img class="emblem" id="hero-logo" src="一级赛徽.jpg" alt="MFD 一级联赛赛徽" loading="eager">
  </div>
</header>

<section id="schedule" class="match-section">
  <div class="match-head">
    <div><div class="kicker">2027 SEASON · MATCH CALENDAR</div><h2>接下来的比赛</h2></div>
  </div>
  <div class="match-carousel">
    <a class="match-arrow is-disabled" id="match-replay" href="#schedule" aria-label="回看已发布比赛视频" aria-disabled="true" title="比赛视频链接待补充">←</a>
    <div class="match-viewport" id="match-viewport" aria-label="未来比赛列表" tabindex="0">
      <div class="match-track" id="match-track"></div>
    </div>
    <button class="match-arrow" id="match-next" type="button" aria-label="查看更多未来比赛">→</button>
  </div>
  <p class="replay-note" id="replay-note">左侧箭头：已发布比赛视频链接待补充</p>
</section>

<script>
const schedule = [
  {date:'元旦', track:'丹东振安国际赛车场', phase:'27上半赛季'},
  {date:'寒假', track:'河北邯郸赛车场'},
  {date:'寒假', track:'吉林通化国际赛车场'},
  {date:'寒假', track:'广州国际赛车场'},
  {date:'清明节', track:'上海国际赛车场', phase:'27下半赛季'},
  {date:'五一', track:'金华国际赛车场'},
  {date:'端午', track:'福建厦门国际赛车场'},
  {date:'待定', track:'石家庄国际赛车场'}
];
const matchTrack = document.querySelector('#match-track');
const matchViewport = document.querySelector('#match-viewport');
const replayLink = document.querySelector('#match-replay');
const nextMatchButton = document.querySelector('#match-next');
const replayUrl = '';

matchTrack.innerHTML = schedule.map((match, index) => `
  <article class="match-card">
    <div class="match-card-meta"><span class="match-date">${match.date}</span>
      <span class="match-phase">${match.phase || `第 ${String(index + 1).padStart(2, '0')} 站`}</span></div>
    <h3>${match.track}</h3>
    <p>具体比赛日期及开赛时间以公告为准</p>
    <span class="match-status">未开始</span>
  </article>`).join('') + `
  <article class="match-card match-coming"><div>
    <div class="match-card-meta"><span class="match-date">MORE</span></div>
    <h3>敬请期待</h3><p>更多赛事信息即将公布</p>
  </div></article>`;

if (replayUrl) {
  replayLink.href = replayUrl;
  replayLink.target = '_blank';
  replayLink.rel = 'noopener noreferrer';
  replayLink.classList.remove('is-disabled');
  replayLink.removeAttribute('aria-disabled');
  replayLink.title = '打开已发布比赛视频';
  document.querySelector('#replay-note').textContent = '左侧箭头：回看已发布比赛视频';
} else {
  replayLink.addEventListener('click', event => {
    event.preventDefault();
    document.querySelector('#replay-note').textContent = '比赛回放视频链接待补充';
  });
}

function updateMatchControls() {
  nextMatchButton.disabled = matchViewport.scrollLeft + matchViewport.clientWidth >= matchViewport.scrollWidth - 4;
}
nextMatchButton.addEventListener('click', () => {
  const card = matchTrack.querySelector('.match-card');
  if (card) matchViewport.scrollBy({left: card.getBoundingClientRect().width + 14, behavior: 'auto'});
});
matchViewport.addEventListener('scroll', updateMatchControls, {passive: true});
window.addEventListener('resize', updateMatchControls);
updateMatchControls();
</script>
</body>
</html>
